<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del empleado</title>
</head>
<body>
    <!--Esta es la seccion visible de la pagina web-->
    <h1>Inicio de sesion (empleado)</h1>
    <!--Formulario web-->
    <form action="#" method="">
            <fieldset>
            <legend>Datos del estudiante</legend>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos">

            <label  for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">

            <label  for="nombre de usuario">Nombre de usuario:</label>
            <input type="text" id="nombre de usuario" name="nombre de usuario">


            <br>
            <br>

            <label  for="correo electronico">correo electronico:</label>
            <input type="text" id="correo electronico" name="correo electronico">

            <label for="Fecha de nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="Fecha de nacimiento" name="Fecha de nacimiento">
            
            <label for="Lugar de nacimiento">Lugar de nacimiento:</label>
            <input type="text" id="Lugar de nacimiento" name="Lugar de nacimiento">

            <br>
            <br>

            <label for="edad">edad:</label>
            <input type="text" id="edad" name="edad">

            <label for="Tipo documento identidad">Tipo documento identidad:</label>
            <input type="radio" id="DI" name="DI" value="T.I">
            <label for="T.I">T.I</label>
            <input type="radio" id="DI" name="DI" value="C.C">
            <label for="C.C">C.C</label>

            <label for="Numero documento identidad">Numero documento identidad:</label>
            <input type="text" id="Numero documento identidad" name="Numero documento identidad">
            

            <br>
            <br>

            <label for="Lugar expedicion documento identidad">Lugar expedicion documento identidad:</label>
            <input type="text" id="Lugar expedicion documento identidad" name="Lugar expedicion documento identidad">

            <br>
            <br>

            <label for="Direccion">Direccion:</label>
            <input type="text" id="Direccion" name="Direccion">

            <label for="Barrio">Barrio:</label>
            <input type="text" id="Barrio" name="Barrio">

            <label for="Ciudad">Ciudad:</label>
            <input type="text" id="Ciudad" name="Ciudad">

            <label for="Pais">Pais:</label>
            <input type="text" id="Pais" name="Pais">

            <br>
            <br>


            <label for="E-mail personal">E-mail personal:</label>
            <input type="text" id="E-mail personal" name="E-mail personal">

            <label for="Numero de telefono">Telefono:</label>
            <input type="text" id="Telefono" name="Telefono">
